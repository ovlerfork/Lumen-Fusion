name: macOS native app artifact

on:
  workflow_dispatch:
  push:
    branches: [feat/lumen-fusion]

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BUILD_VERSION: 0.0.${{ github.run_number }}
    steps:
      - name: Initialize diagnostics
        run: echo "DIAGNOSTICS=${RUNNER_TEMP}/native-validation-diagnostics" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Initialize macOS dependencies
        run: |
          test "$(uname -m)" = arm64
          git submodule update --init --depth 1 -- \
            third-party/build-deps third-party/libdisplaydevice \
            third-party/moonlight-common-c third-party/nv-codec-headers \
            third-party/Simple-Web-Server third-party/TPCircularBuffer \
            third-party/tray third-party/googletest
          git -C third-party/moonlight-common-c submodule update --init --depth 1 -- enet
      - name: Install dependencies
        run: bash scripts/macos_build.sh --step=deps
      - name: Configure
        run: bash scripts/macos_build.sh --step=cmake --build-tests
      - name: Build
        run: |
          cmake --build build-macos-zip --target sunshine web-ui vd_helper test_sunshine --parallel 3
      - name: Test
        working-directory: build-macos-zip/tests
        run: |
          # Lumen intentionally removed docs/configuration.md when it became macOS-only.
          # Keep the three remaining ConfigConsistency tests and all runtime/unit tests,
          # but exclude the two Sunshine documentation-consistency checks that require it.
          mkdir -p "$DIAGNOSTICS"
          ./test_sunshine --gtest_output="xml:$DIAGNOSTICS/gtest.xml" --gtest_filter=-ConfigConsistencyTest.AllConfigOptionsExistInAllFiles:ConfigConsistencyTest.ConfigTabsMatchDocumentationSections
      - name: Package
        run: |
          bash scripts/macos_build.sh --step=zip
          bash scripts/macos_build.sh --step=dmg
      - name: Validate extracted ZIP
        run: |
          extracted="$(mktemp -d "${RUNNER_TEMP}/native ZIP.XXXXXX")"
          ditto -x -k build-macos-zip/cpack_artifacts/Lumina.zip "$extracted"
          bash scripts/validate-macos-package.sh "$extracted/Lumen Fusion.app" "$DIAGNOSTICS/zip"
      - name: Validate detached DMG installation
        run: |
          dmg="${PWD}/build-macos-zip/cpack_artifacts/Lumina.dmg"
          mount_point="$(mktemp -d "${RUNNER_TEMP}/mounted Lumen Fusion.XXXXXX")"
          installation="$(mktemp -d "${RUNNER_TEMP}/native installation.XXXXXX")/Applications"
          mkdir -p "$installation" "$DIAGNOSTICS/dmg"
          exec > >(tee "$DIAGNOSTICS/dmg/install.log") 2>&1
          attached=false
          cleanup() {
            if "$attached"; then
              hdiutil detach "$mount_point"
            fi
          }
          trap cleanup EXIT
          hdiutil verify "$dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$dmg"
          attached=true
          test -L "$mount_point/Applications"
          test "$(readlink "$mount_point/Applications")" = /Applications
          ditto "$mount_point/Lumen Fusion.app" "$installation/Lumen Fusion.app"
          hdiutil detach "$mount_point"
          attached=false
          trap - EXIT
          bash scripts/validate-macos-package.sh "$installation/Lumen Fusion.app" "$DIAGNOSTICS/dmg"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-fusion-native-failure-diagnostics
          path: |
            ${{ env.DIAGNOSTICS }}/**/*.log
            ${{ env.DIAGNOSTICS }}/gtest.xml
          if-no-files-found: warn
      - name: Upload validated ZIP and DMG
        uses: actions/upload-artifact@v4
        with:
          name: lumen-fusion-macos-arm64
          path: |
            build-macos-zip/cpack_artifacts/Lumina.zip
            build-macos-zip/cpack_artifacts/Lumina.dmg
          if-no-files-found: error
