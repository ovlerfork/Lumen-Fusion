name: macOS portable artifact

on:
  workflow_dispatch:
  push:
    branches: [feat/lumen-fusion]

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BUILD_VERSION: 0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Initialize macOS dependencies
        run: |
          test "$(uname -m)" = arm64
          git submodule update --init --depth 1 -- \
            third-party/build-deps third-party/libdisplaydevice \
            third-party/moonlight-common-c third-party/nv-codec-headers \
            third-party/Simple-Web-Server third-party/TPCircularBuffer \
            third-party/tray third-party/googletest
          git -C third-party/moonlight-common-c submodule update --init --depth 1 -- enet
      - name: Install dependencies
        run: bash scripts/macos_build.sh --step=deps
      - name: Configure
        run: bash scripts/macos_build.sh --step=cmake --build-tests
      - name: Build
        run: |
          cmake --build build-macos-zip --target sunshine web-ui vd_helper test_sunshine --parallel 3
      - name: Test
        working-directory: build-macos-zip/tests
        run: |
          # Lumen intentionally removed docs/configuration.md when it became macOS-only.
          # Keep the three remaining ConfigConsistency tests and all runtime/unit tests,
          # but exclude the two Sunshine documentation-consistency checks that require it.
          ./test_sunshine --gtest_filter=-ConfigConsistencyTest.AllConfigOptionsExistInAllFiles:ConfigConsistencyTest.ConfigTabsMatchDocumentationSections
      - name: Package
        run: |
          bash scripts/macos_build.sh --step=zip
          bash scripts/macos_build.sh --step=dmg
      - name: Validate extracted ZIP
        run: |
          extracted="${RUNNER_TEMP}/portable runtime"
          mkdir -p "$extracted"
          ditto -x -k build-macos-zip/cpack_artifacts/Lumina.zip "$extracted"
          validation_home="$(mktemp -d "${RUNNER_TEMP}/zip home.XXXXXX")"
          bash scripts/validate-macos-package.sh "$extracted/Lumina" "$validation_home"
      - name: Validate mounted DMG and detached installation
        run: |
          dmg="${PWD}/build-macos-zip/cpack_artifacts/Lumina.dmg"
          mount_point="${RUNNER_TEMP}/mounted Lumen Fusion"
          validation_home="$(mktemp -d "${RUNNER_TEMP}/dmg home.XXXXXX")"
          mkdir -p "$mount_point"
          cleanup() {
            if mount | grep -Fq " on $mount_point ("; then
              hdiutil detach "$mount_point"
            fi
          }
          trap cleanup EXIT
          hdiutil verify "$dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$dmg"
          bash scripts/validate-macos-package.sh "$mount_point" "$validation_home"
          hdiutil detach "$mount_point"
          trap - EXIT
          cd "$RUNNER_TEMP"
          env HOME="$validation_home" PATH="${validation_home}/.local/bin:${PATH}" lumen-fusion --help
      - name: Upload validated ZIP and DMG
        uses: actions/upload-artifact@v4
        with:
          name: lumen-fusion-macos-arm64
          path: |
            build-macos-zip/cpack_artifacts/Lumina.zip
            build-macos-zip/cpack_artifacts/Lumina.dmg
          if-no-files-found: error
